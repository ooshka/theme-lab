[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theme-lab"
version = "0.1.0"
description = "A local visual editor for Windows Terminal color schemes"
requires-python = ">=3.11"

[project.scripts]
theme-lab = "terminal_theme_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

